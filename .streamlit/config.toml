# Local-first Streamlit configuration.
# Requirements: 1.1, 1.3, 1.4, 17.1, 17.2

[browser]
# No usage statistics leave the local machine.
gatherUsageStats = false

[server]
# Bind the local dashboard to the loopback interface only.
address = "127.0.0.1"
headless = true
fileWatcherType = "none"
enableXsrfProtection = true
enableStaticServing = false

[client]
toolbarMode = "minimal"
# User-facing failures must not expose stack traces.
showErrorDetails = "none"

[runner]
# Only explicit render calls produce output.
magicEnabled = false

[logger]
level = "warning"
