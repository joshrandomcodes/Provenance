# Local-first Streamlit configuration.
# Requirements: 1.1, 1.3, 1.4, 17.1, 17.2

[browser]
# No usage statistics leave the local machine.
gatherUsageStats = false

[server]
# Bind the local dashboard to the loopback interface only.
address = "127.0.0.1"
headless = true
fileWatcherType = "none"
enableXsrfProtection = true
enableStaticServing = false

[client]
toolbarMode = "minimal"
# User-facing failures must not expose stack traces.
showErrorDetails = "none"

[runner]
# Only explicit render calls produce output.
magicEnabled = false

[logger]
level = "warning"

# Original palette and type scale, inspired by seventh-generation console
# dashboards. No third-party font, image, or asset is fetched: every value below is
# a colour or a system font stack, so applying the theme makes no network request.
[theme]
base = "dark"
primaryColor = "#4FB8FF"
backgroundColor = "#05080F"
secondaryBackgroundColor = "#0D1523"
textColor = "#E8EEF7"
linkColor = "#7FD1FF"
codeBackgroundColor = "#0A1120"
codeTextColor = "#BFD8F2"
borderColor = "#1E2A3D"
dataframeBorderColor = "#1E2A3D"
dataframeHeaderBackgroundColor = "#0D1523"
font = "system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
headingFont = "system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
codeFont = "'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace"
baseFontWeight = 300
baseRadius = "0.35rem"
buttonRadius = "0.25rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#080D18"
secondaryBackgroundColor = "#101B2B"
borderColor = "#1E2A3D"
